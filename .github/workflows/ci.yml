# Everything here runs on a stock runner with no game files.
#
# That constraint is the whole design.  docs/VERIFY.md calls the game files
# "the one thing between it and CI": tests/golden/run.sh needs an
# installation, which is deliberately not in this repository and cannot go
# into one.  So the golden suite and tests/golden/speed-ab.sh are absent here
# on purpose, not by oversight - running them needs either a self-hosted
# runner that already has an install, or a synthetic guest fixture small
# enough to commit.  That decision is still open (docs/HANDOFF.md).
#
# What is left still catches the failure this was written for: a change to a
# shared header that compiles under MSVC and breaks the POSIX build, which
# until now had nothing but somebody's local WSL build standing in its way.
# The parser tests need no install either, so this is a real gate rather than
# only a compile check.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (gcc, -O2)
        run: make

      # The Linux game window (src/host_sdl.c) and its launcher
      # (src/launch_gtk.c).  Compiles and links only:
      # there is no display here and nothing to play without game files.
      - name: Build the SDL2 game window and the GTK launcher
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libgtk-3-dev libcurl4-gnutls-dev libsecret-1-dev
          make gui

      # 22 fixed cases with expected verdicts, milliseconds, meaningful exit
      # status.  Fourteen of them are accepted by the parser as it stood
      # before the validation pass, so this is a gate and not a formality.
      - name: Parser regression suite
        run: |
          make fuzz
          ./pfemu-fuzz-pfr -selftest

      # A short campaign over the committed vector.  tests/golden/*.pfr is in
      # the repository (it carries hashes, not code), so the fuzzer has a real
      # corpus here even though the emulator has nothing to run.  The driver
      # fails a run in which under 1% of cases are accepted, which is what
      # stops this passing while silently testing nothing.
      - name: Fuzz the .pfr parser
        run: ./pfemu-fuzz-pfr -n 50000 tests/golden/deluxe-table3-200s.pfr

      # The -verify JSON object, against stubs.  It is what the service
      # parses, which makes it an interface, and the argument for having it
      # at all was that the human-readable output kept moving underneath its
      # readers.  17 cases, no installation, milliseconds.
      - name: Verdict regression suite
        run: |
          make verify-test
          ./pfemu-verify-test

      # Last, because `make ubsan` starts by cleaning.  This only proves the
      # instrumented build compiles and links - the finding-bugs part needs a
      # vector to execute, which needs an install.
      - name: Instrumented build compiles
        run: make ubsan

  # macOS, with Apple's clang and Homebrew's SDL2, and no launcher (the
  # Makefile sets NOGTK=1 there: libsecret has no Secret Service on a Mac).
  # Intel first, because that is the Mac the golden suite runs on;
  # GitHub keeps macos-15-intel until August 2027, and it is the last
  # x86_64 image it offers.  Apple Silicon beside it, since that is every
  # Mac sold now, and a new architecture for the determinism claims.
  # Compiles and the stub suites only, as above: no game files here.
  #
  # SDL2 comes the way each kind of Mac gets it: on Intel, SDL's own
  # SDL2.framework in ~/Library/Frameworks (Homebrew builds for Intel only
  # from source since 7.0), on Apple Silicon from Homebrew.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            sdl: framework
          - os: macos-latest
            sdl: brew
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (clang, -O2)
        run: make
      - name: SDL2 from Homebrew
        if: matrix.sdl == 'brew'
        run: brew install sdl2
      - name: SDL2.framework from SDL's release .dmg
        if: matrix.sdl == 'framework'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download release-2.32.10 -R libsdl-org/SDL -p 'SDL2-2.32.10.dmg'
          hdiutil attach -nobrowse -mountpoint /tmp/sdl2 SDL2-2.32.10.dmg
          mkdir -p ~/Library/Frameworks
          cp -R /tmp/sdl2/SDL2.framework ~/Library/Frameworks/
          hdiutil detach /tmp/sdl2
      - name: Build the SDL2 game window
        run: |
          make gui
          otool -L pfemu | grep -i sdl
      - name: Parser regression suite
        run: |
          make fuzz
          ./pfemu-fuzz-pfr -selftest
      - name: Verdict regression suite
        run: |
          make verify-test
          ./pfemu-verify-test

  # The build the Linux release ships (release.yml, job "linux"): the SDL2
  # window inside Ubuntu 22.04, whose SDL is 2.0.20 and GTK 3.24.33.  The
  # job above builds against the newest of both; this one catches a call
  # the oldest does not have, on every push rather than on the first
  # release tag.
  linux-release-build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Toolchain, SDL2 and GTK 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates pkg-config libsdl2-dev libgtk-3-dev libcurl4-gnutls-dev libsecret-1-dev
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make gui
