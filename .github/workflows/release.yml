name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: .\build.bat
        shell: cmd
      - run: gh release create "${{ github.ref_name }}" --generate-notes pfemu.exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Linux game window and launcher (make gui), packaged as a tarball.
  # Built inside Ubuntu 22.04 rather than on the runner's own image: a
  # binary runs on the glibc it was linked against and anything newer, so
  # the oldest system still in wide use is the one to build on.  SDL2,
  # GTK 3, libcurl and libsecret are left to the system (libsdl2-2.0-0,
  # libgtk-3-0, libcurl3-gnutls, libsecret-1-0), the way every distribution
  # ships them.  libcurl is the GnuTLS build because that is the one a
  # desktop Ubuntu already has.
  linux:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Toolchain, SDL2 and GTK 3
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git ca-certificates pkg-config libsdl2-dev libgtk-3-dev libcurl4-gnutls-dev libsecret-1-dev
      - uses: actions/checkout@v4
      # The container runs as root over a checkout owned by the runner user;
      # without this git refuses the tree and the build id says "unknown".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make gui
      - name: Package
        run: |
          d=pfemu-linux-x86_64
          mkdir "$d"
          cp pfemu res/pfemu.png res/linux/install-desktop-entry.sh res/linux/README.txt "$d/"
          chmod 755 "$d/pfemu" "$d/install-desktop-entry.sh"
          tar czf "$d.tar.gz" "$d"
      - uses: actions/upload-artifact@v4
        with:
          name: pfemu-linux-x86_64
          path: pfemu-linux-x86_64.tar.gz

  # Onto the release the Windows job created.  A job of its own on the
  # runner, which has gh; the build container does not.
  linux-upload:
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pfemu-linux-x86_64
      - run: gh release upload "${{ github.ref_name }}" pfemu-linux-x86_64.tar.gz --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # pfemu.app (make app, res/mac/build-app.sh): Intel and Apple Silicon in
  # one program, SDL2.framework inside, signed ad hoc, zipped with its
  # README by ditto, which keeps the framework's symlinks.  Onto the release
  # the Windows job created; the Mac runner has gh itself.
  macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: SDL2.framework from SDL's release .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download release-2.32.10 -R libsdl-org/SDL -p 'SDL2-2.32.10.dmg'
          hdiutil attach -nobrowse -mountpoint /tmp/sdl2 SDL2-2.32.10.dmg
          mkdir -p ~/Library/Frameworks
          cp -R /tmp/sdl2/SDL2.framework ~/Library/Frameworks/
          hdiutil detach /tmp/sdl2
      - name: pfemu.app
        env:
          PFEMU_VERSION: ${{ github.ref_name }}
        run: |
          export PFEMU_VERSION="${PFEMU_VERSION#v}"
          make app
      - name: Package
        run: |
          d=pfemu-macos
          mkdir "$d"
          ditto pfemu.app "$d/pfemu.app"
          cp res/mac/README.txt "$d/"
          ditto -c -k --keepParent "$d" "$d.zip"
      - run: gh release upload "${{ github.ref_name }}" pfemu-macos.zip --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
